name: Auto Release (Full)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: last_tag
        run: |
          TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compute next version
        id: version
        run: |
          node -e "const tag=process.env.LAST_TAG||'';let v='1.0.0';if(tag){const t=tag.replace(/^v/,'');const parts=t.split('.').map(n=>parseInt(n,10));if(parts.length===3&&!parts.some(Number.isNaN)){parts[2]+=1;v=parts.join('.');}}console.log('version='+v);" >> $GITHUB_OUTPUT
        env:
          LAST_TAG: ${{ steps.last_tag.outputs.tag }}

      - name: Generate release notes
        id: notes
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          NOTES=$(git log $RANGE --pretty=format:'- %s (%h)')
          if [ -z "$NOTES" ]; then
            NOTES='- 自动发布'
          fi
          EOF=$(openssl rand -hex 8)
          echo "notes<<$EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Zip dist
        run: zip -r woodll-tools-${{ steps.version.outputs.version }}.zip dist/*

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## 变更说明

            ${{ steps.notes.outputs.notes }}

            ## 资源

            - `woodll-tools-${{ steps.version.outputs.version }}.zip`
          files: woodll-tools-${{ steps.version.outputs.version }}.zip
